name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 0,12 * * *" # UTC 00:00 / 12:00 = JST 09:00 / 21:00
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health-check function
        run: |
          curl -sf -X POST "https://puwumxiuhsfmlpfkbbhb.supabase.co/functions/v1/health-check" \
            -o /dev/null -w "status=%{http_code}\n"
