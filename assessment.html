<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>イラスト回答 | ADOC-S 研究アプリ</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app" class="page">
  <div class="card card--wide">
    <template v-if="done">
      <template v-if="showSurvey">
        <h1>アンケートにご協力ください</h1>
        <p class="lead">最後に2つだけ質問があります</p>

        <div v-if="surveyErrorMessage" class="alert alert-error">{{ surveyErrorMessage }}</div>

        <div class="field">
          <label>お子さんに聞いてください:今日のクイズは簡単でしたか、難しかったですか</label>
          <div class="radio-group radio-group--scale">
            <label v-for="opt in difficultyOptions" :key="opt">
              <input type="radio" :value="opt" v-model="childDifficultyRating" :disabled="surveySubmitting" /> {{ opt }}
            </label>
          </div>
        </div>

        <div class="field">
          <label>保護者・検査者の方へ:お子さんはどれくらい理解できていたと思いますか</label>
          <div class="radio-group radio-group--scale">
            <label v-for="opt in comprehensionOptions" :key="opt">
              <input type="radio" :value="opt" v-model="caregiverComprehensionRating" :disabled="surveySubmitting" /> {{ opt }}
            </label>
          </div>
        </div>

        <div class="btn-row">
          <button type="button" class="btn-primary" :disabled="surveySubmitting || !canSubmitSurvey" @click="onSubmitSurvey">
            {{ surveySubmitting ? '送信中…' : '送信する' }}
          </button>
        </div>
      </template>
      <template v-else>
        <h1>これで終了です。お疲れ様でした。</h1>
      </template>
    </template>
    <template v-else>
      <div v-if="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

      <div v-if="loading" class="spinner-text">読み込み中…</div>

      <template v-else-if="illustration">
        <div class="progress">{{ practiceMode ? '練習' : progressText }}</div>

        <p v-if="practiceMode" class="question-prompt question-prompt--practice">まずは1回、練習してみましょう。</p>
        <p class="question-prompt">下の絵は何をしているところですか? または、なんの絵ですか?</p>

        <div class="illustration-wrap">
          <img :src="illustration.image_url" alt="イラスト" @error="onImageError" />
        </div>
        <div v-if="imageErrorMessage" class="alert alert-error">{{ imageErrorMessage }}</div>

        <div class="field">
          <label for="verbal_response">発話 <span class="hint-inline">(イラストに関する回答のみ記入してください)</span></label>
          <textarea
            id="verbal_response"
            class="textarea-compact"
            v-model="verbalResponse"
            :disabled="submitting || showChoices"
          ></textarea>
          <div class="hint">ヒントをみる(「わからない」を押す)場合は、ここを空欄に。</div>
        </div>

        <div class="btn-row" v-if="!showChoices">
          <button type="button" class="btn-secondary" :disabled="submitting || Boolean(verbalResponse.trim())" @click="onDontKnow">
            わからない
          </button>
        </div>

        <template v-if="showChoices">
          <div class="choice-grid">
            <button
              v-for="c in choices"
              :key="c"
              type="button"
              :class="{ selected: selectedChoice === c }"
              :disabled="submitting"
              @click="selectChoice(c)"
            >{{ c }}</button>
            <button
              type="button"
              :class="{ selected: selectedChoice === UNKNOWN_LABEL }"
              :disabled="submitting"
              @click="selectChoice(UNKNOWN_LABEL)"
            >{{ UNKNOWN_LABEL }}</button>
          </div>
          <p class="examiner-note">検査者の方へ:選択肢を読みあげてください。意味が変わらない範囲でわかりやすいように言い換えてもらって構いません。</p>
        </template>

        <div class="btn-row">
          <button type="button" class="btn-primary" :disabled="submitting || !canSubmit" @click="onNext">
            {{ submitting ? '保存中…' : (practiceMode ? '練習を終えて本番へ' : '次へ') }}
          </button>
          <button type="button" class="btn-secondary" :disabled="submitting" @click="onStopForToday">
            今日はここまで
          </button>
        </div>
      </template>
    </template>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/messages.js"></script>
<script src="js/session.js"></script>
<script src="js/api.js"></script>
<script>
const { createApp } = Vue;

// 練習用のダミー設問。全年齢層で共通、最初の1問(累計回答0件)の前に必ず1回だけ表示する。
const PRACTICE_ILLUSTRATION = {
  id: "practice",
  image_url: "img/practice-phone.jpg",
};
const PRACTICE_CHOICES = ["電話", "食事", "着替え"];

const UNKNOWN_LABEL = "わからない";

createApp({
  data() {
    return {
      session: null,
      loading: true,
      submitting: false,
      errorMessage: "",
      done: false,
      illustration: null,
      choices: [],
      showChoices: false,
      selectedChoice: null,
      verbalResponse: "",
      progress: { answered: 0, total: 0 },
      imageErrorMessage: "",
      practiceMode: false,
      practiceDone: false,
      pendingReal: null,
      UNKNOWN_LABEL,
      surveyCompleted: false,
      childDifficultyRating: "",
      caregiverComprehensionRating: "",
      surveySubmitting: false,
      surveyErrorMessage: "",
      difficultyOptions: ["とても簡単だった", "簡単だった", "普通", "難しかった", "とても難しかった"],
      comprehensionOptions: [
        "とても理解できていたと思う", "理解できていたと思う", "まあまあ理解できたと思う",
        "あまり理解できていなかったと思う", "全く理解できていなかったと思う",
      ],
    };
  },
  computed: {
    progressText() {
      return `${this.progress.answered}/${this.progress.total}枚`;
    },
    canSubmit() {
      return Boolean(this.verbalResponse.trim()) || Boolean(this.selectedChoice);
    },
    showSurvey() {
      return this.done && !this.surveyCompleted;
    },
    canSubmitSurvey() {
      return Boolean(this.childDifficultyRating) && Boolean(this.caregiverComprehensionRating);
    },
  },
  mounted() {
    this.session = Session.requireLoginOrRedirect();
    if (!this.session) return;

    history.pushState(null, "", location.href);
    window.addEventListener("popstate", this.onPopState);

    this.loadNext();
  },
  methods: {
    onPopState() {
      history.pushState(null, "", location.href);
    },
    async loadNext() {
      this.loading = true;
      this.errorMessage = "";
      this.showChoices = false;
      this.selectedChoice = null;
      this.verbalResponse = "";
      this.imageErrorMessage = "";

      const result = await Api.callFunction("get-next-question", {
        token: this.session.token,
      });

      this.loading = false;

      if (!result.ok) {
        this.errorMessage = result.message;
        if (result.status === 401) {
          Session.clear();
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        }
        return;
      }

      this.progress = result.data.progress;

      if (result.data.done) {
        this.done = true;
        this.surveyCompleted = Boolean(result.data.survey_completed);
        return;
      }

      if (this.progress.answered === 0 && !this.practiceDone) {
        this.practiceMode = true;
        this.illustration = PRACTICE_ILLUSTRATION;
        this.choices = PRACTICE_CHOICES;
        this.pendingReal = { illustration: result.data.illustration, choices: result.data.choices };
        return;
      }

      this.practiceMode = false;
      this.illustration = result.data.illustration;
      this.choices = result.data.choices;
    },
    onImageError() {
      this.imageErrorMessage = window.MESSAGES.IMAGE_ERROR;
    },
    onDontKnow() {
      this.showChoices = true;
    },
    selectChoice(c) {
      this.selectedChoice = c;
    },
    async onNext() {
      if (this.submitting || !this.canSubmit) return;

      if (this.practiceMode) {
        this.practiceDone = true;
        this.practiceMode = false;
        this.illustration = this.pendingReal.illustration;
        this.choices = this.pendingReal.choices;
        this.pendingReal = null;
        this.showChoices = false;
        this.selectedChoice = null;
        this.verbalResponse = "";
        this.imageErrorMessage = "";
        return;
      }

      this.submitting = true;
      this.errorMessage = "";

      const result = await Api.callFunction("submit-response", {
        token: this.session.token,
        body: {
          illustration_id: this.illustration.id,
          verbal_response: this.verbalResponse,
          used_choices: this.showChoices,
          presented_choices: this.showChoices ? [...this.choices, UNKNOWN_LABEL] : null,
          selected_choice_label: this.selectedChoice,
        },
      });

      if (!result.ok) {
        this.submitting = false;
        this.errorMessage = result.message;
        if (result.status === 401) {
          Session.clear();
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        }
        return;
      }

      this.submitting = false;
      await this.loadNext();
    },
    onStopForToday() {
      if (this.submitting) return;
      const hasDraft = Boolean(this.verbalResponse.trim()) || Boolean(this.selectedChoice);
      if (hasDraft && !window.confirm("入力中の内容は保存されていません。今日はここまでにしますか?")) {
        return;
      }
      Session.clear();
      window.location.href = "login.html";
    },
    async onSubmitSurvey() {
      if (this.surveySubmitting || !this.canSubmitSurvey) return;
      this.surveySubmitting = true;
      this.surveyErrorMessage = "";

      const result = await Api.callFunction("submit-survey", {
        token: this.session.token,
        body: {
          child_difficulty_rating: this.childDifficultyRating,
          caregiver_comprehension_rating: this.caregiverComprehensionRating,
        },
      });

      this.surveySubmitting = false;

      if (!result.ok) {
        this.surveyErrorMessage = result.message;
        if (result.status === 401) {
          Session.clear();
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        }
        return;
      }

      this.surveyCompleted = true;
    },
  },
}).mount("#app");
</script>
</body>
</html>
