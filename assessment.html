<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>イラスト回答 | ADOC-S 研究アプリ</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app" class="page">
  <div class="card card--wide">
    <template v-if="done">
      <template v-if="showSurvey">
        <h1>アンケートにご協力ください</h1>
        <p class="lead">最後に2つだけ質問があります</p>

        <div v-if="surveyErrorMessage" class="alert alert-error">{{ surveyErrorMessage }}</div>

        <div class="field">
          <label>お子さんに聞いてください:今日のクイズは簡単でしたか、難しかったですか</label>
          <div class="radio-group">
            <label v-for="opt in difficultyOptions" :key="opt">
              <input type="radio" :value="opt" v-model="childDifficultyRating" :disabled="surveySubmitting" /> {{ opt }}
            </label>
          </div>
        </div>

        <div class="field">
          <label>保護者・検査者の方へ:お子さんはどれくらい理解できていたと思いますか</label>
          <div class="radio-group">
            <label v-for="opt in comprehensionOptions" :key="opt">
              <input type="radio" :value="opt" v-model="caregiverComprehensionRating" :disabled="surveySubmitting" /> {{ opt }}
            </label>
          </div>
        </div>

        <div class="btn-row">
          <button type="button" class="btn-primary" :disabled="surveySubmitting || !canSubmitSurvey" @click="onSubmitSurvey">
            {{ surveySubmitting ? '送信中…' : '送信する' }}
          </button>
        </div>
      </template>
      <template v-else>
        <h1>これで終了です。お疲れ様でした。</h1>
      </template>
    </template>
    <template v-else>
      <div v-if="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

      <div v-if="loading" class="spinner-text">読み込み中…</div>

      <template v-else-if="illustration">
        <div class="progress">{{ progressText }}</div>

        <div class="illustration-wrap">
          <img :src="illustration.image_url" alt="イラスト" @error="onImageError" />
        </div>
        <div v-if="imageErrorMessage" class="alert alert-error">{{ imageErrorMessage }}</div>

        <div class="field">
          <label for="verbal_response">発話内容</label>
          <textarea
            id="verbal_response"
            v-model="verbalResponse"
            :disabled="submitting"
          ></textarea>
        </div>

        <div class="btn-row" v-if="!showChoices">
          <button type="button" class="btn-secondary" :disabled="submitting" @click="onDontKnow">
            わからない
          </button>
        </div>

        <div class="choice-grid" v-if="showChoices">
          <button
            v-for="c in choices"
            :key="c"
            type="button"
            :class="{ selected: selectedChoice === c }"
            :disabled="submitting"
            @click="selectChoice(c)"
          >{{ c }}</button>
        </div>

        <div class="btn-row">
          <button type="button" class="btn-primary" :disabled="submitting || !canSubmit" @click="onNext">
            {{ submitting ? '保存中…' : '次へ' }}
          </button>
          <button type="button" class="btn-secondary" :disabled="submitting" @click="onStopForToday">
            今日はここまで
          </button>
        </div>
      </template>
    </template>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/messages.js"></script>
<script src="js/session.js"></script>
<script src="js/api.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      session: null,
      loading: true,
      submitting: false,
      errorMessage: "",
      done: false,
      illustration: null,
      choices: [],
      showChoices: false,
      selectedChoice: null,
      verbalResponse: "",
      progress: { answered: 0, total: 0 },
      imageErrorMessage: "",
      surveyCompleted: false,
      childDifficultyRating: "",
      caregiverComprehensionRating: "",
      surveySubmitting: false,
      surveyErrorMessage: "",
      difficultyOptions: ["とても簡単だった", "簡単だった", "普通", "難しかった", "とても難しかった"],
      comprehensionOptions: [
        "とても理解できていたと思う", "理解できていたと思う", "まあまあ理解できたと思う",
        "あまり理解できていなかったと思う", "全く理解できていなかったと思う",
      ],
    };
  },
  computed: {
    progressText() {
      return `${this.progress.answered}/${this.progress.total}枚`;
    },
    canSubmit() {
      return Boolean(this.verbalResponse.trim()) || Boolean(this.selectedChoice);
    },
    showSurvey() {
      return this.done && !this.surveyCompleted;
    },
    canSubmitSurvey() {
      return Boolean(this.childDifficultyRating) && Boolean(this.caregiverComprehensionRating);
    },
  },
  mounted() {
    this.session = Session.requireLoginOrRedirect();
    if (!this.session) return;

    history.pushState(null, "", location.href);
    window.addEventListener("popstate", this.onPopState);

    this.loadNext();
  },
  methods: {
    onPopState() {
      history.pushState(null, "", location.href);
    },
    async loadNext() {
      this.loading = true;
      this.errorMessage = "";
      this.showChoices = false;
      this.selectedChoice = null;
      this.verbalResponse = "";
      this.imageErrorMessage = "";

      const result = await Api.callFunction("get-next-question", {
        token: this.session.token,
      });

      this.loading = false;

      if (!result.ok) {
        this.errorMessage = result.message;
        if (result.status === 401) {
          Session.clear();
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        }
        return;
      }

      this.progress = result.data.progress;

      if (result.data.done) {
        this.done = true;
        this.surveyCompleted = Boolean(result.data.survey_completed);
        return;
      }

      this.illustration = result.data.illustration;
      this.choices = result.data.choices;
    },
    onImageError() {
      this.imageErrorMessage = window.MESSAGES.IMAGE_ERROR;
    },
    onDontKnow() {
      this.showChoices = true;
    },
    selectChoice(c) {
      this.selectedChoice = c;
    },
    async onNext() {
      if (this.submitting || !this.canSubmit) return;
      this.submitting = true;
      this.errorMessage = "";

      const result = await Api.callFunction("submit-response", {
        token: this.session.token,
        body: {
          illustration_id: this.illustration.id,
          verbal_response: this.verbalResponse,
          used_choices: this.showChoices,
          presented_choices: this.showChoices ? this.choices : null,
          selected_choice_label: this.selectedChoice,
        },
      });

      if (!result.ok) {
        this.submitting = false;
        this.errorMessage = result.message;
        if (result.status === 401) {
          Session.clear();
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        }
        return;
      }

      this.submitting = false;
      await this.loadNext();
    },
    onStopForToday() {
      if (this.submitting) return;
      const hasDraft = Boolean(this.verbalResponse.trim()) || Boolean(this.selectedChoice);
      if (hasDraft && !window.confirm("入力中の内容は保存されていません。今日はここまでにしますか?")) {
        return;
      }
      Session.clear();
      window.location.href = "login.html";
    },
    async onSubmitSurvey() {
      if (this.surveySubmitting || !this.canSubmitSurvey) return;
      this.surveySubmitting = true;
      this.surveyErrorMessage = "";

      const result = await Api.callFunction("submit-survey", {
        token: this.session.token,
        body: {
          child_difficulty_rating: this.childDifficultyRating,
          caregiver_comprehension_rating: this.caregiverComprehensionRating,
        },
      });

      this.surveySubmitting = false;

      if (!result.ok) {
        this.surveyErrorMessage = result.message;
        if (result.status === 401) {
          Session.clear();
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        }
        return;
      }

      this.surveyCompleted = true;
    },
  },
}).mount("#app");
</script>
</body>
</html>
