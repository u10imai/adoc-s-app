<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>基本情報の入力 | ADOC-S 研究アプリ</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app" class="page">
  <div class="card">
    <h1>基本情報の入力</h1>
    <p class="lead">最初に一度だけ、対象のお子さまについて教えてください</p>

    <div v-if="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form @submit.prevent="onSubmit">
      <div class="field">
        <label for="examiner_type">検査者</label>
        <select id="examiner_type" v-model="examinerType" :disabled="loading">
          <option value="" disabled>選択してください</option>
          <option value="保護者">保護者</option>
          <option value="研究者">研究者</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="field" v-if="examinerType === '保護者'">
        <label for="guardian_profession">保護者の方の専門職属性</label>
        <select id="guardian_profession" v-model="guardianProfession" :disabled="loading">
          <option value="" disabled>選択してください</option>
          <option v-for="p in guardianProfessions" :key="p" :value="p">{{ p }}</option>
        </select>
      </div>

      <div class="field" v-if="examinerType === '保護者' && guardianProfession === 'その他'">
        <label for="guardian_profession_other">差し支えない範囲でご記入ください</label>
        <textarea id="guardian_profession_other" v-model="guardianProfessionOther" :disabled="loading"></textarea>
      </div>

      <div class="field">
        <label for="exam_date">検査日</label>
        <input
          id="exam_date"
          type="date"
          v-model="examDate"
          :disabled="loading"
        />
      </div>

      <div class="field">
        <label for="birth_date">生年月日(わかる場合のみ、任意)</label>
        <input
          id="birth_date"
          type="date"
          v-model="birthDate"
          :disabled="loading"
        />
        <div class="hint">わからない場合は空欄のままで構いません</div>
      </div>

      <div class="field">
        <label>性別</label>
        <div class="radio-group">
          <label><input type="radio" value="男" v-model="gender" :disabled="loading" /> 男</label>
          <label><input type="radio" value="女" v-model="gender" :disabled="loading" /> 女</label>
        </div>
      </div>

      <div class="field">
        <label for="grade">学年</label>
        <select id="grade" v-model="grade" :disabled="loading">
          <option value="" disabled>選択してください</option>
          <option v-for="g in grades" :key="g" :value="g">{{ g }}</option>
        </select>
      </div>

      <div class="field">
        <label>これまで、言語や運動の発達に関する個別の指導(言語療法や作業療法など)へ定期的に通った経験がありますか</label>
        <div class="radio-group">
          <label><input type="radio" value="none" v-model="diagnosisStatus" :disabled="loading" /> 受けていない</label>
          <label><input type="radio" value="current" v-model="diagnosisStatus" :disabled="loading" /> 現在受けている</label>
          <label><input type="radio" value="past" v-model="diagnosisStatus" :disabled="loading" /> 以前受けていた</label>
        </div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn-primary" :disabled="loading || !canSubmit">
          {{ loading ? '保存中…' : '次へ進む' }}
        </button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/messages.js"></script>
<script src="js/session.js"></script>
<script src="js/api.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      grades: ["年少", "年中", "年長", "小学校1年", "小学校2年", "小学校3年", "小学校4年", "小学校5年", "小学校6年", "中学生"],
      guardianProfessions: ["作業療法士", "理学療法士", "言語聴覚士", "心理士", "社会福祉士", "その他"],
      examinerType: "",
      guardianProfession: "",
      guardianProfessionOther: "",
      examDate: new Date().toISOString().slice(0, 10),
      birthDate: "",
      gender: "",
      grade: "",
      diagnosisStatus: "",
      loading: false,
      errorMessage: "",
      session: null,
    };
  },
  computed: {
    canSubmit() {
      if (this.examinerType === "保護者" && !this.guardianProfession) return false;
      return Boolean(this.examinerType) && Boolean(this.examDate) && Boolean(this.gender) && Boolean(this.grade) && Boolean(this.diagnosisStatus);
    },
  },
  mounted() {
    this.session = Session.requireLoginOrRedirect();
  },
  methods: {
    async onSubmit() {
      if (this.loading || !this.session) return;
      this.loading = true;
      this.errorMessage = "";

      const result = await Api.callFunction("submit-basic-info", {
        token: this.session.token,
        body: {
          examiner_type: this.examinerType,
          guardian_profession: this.examinerType === "保護者" ? this.guardianProfession : "",
          guardian_profession_other: this.examinerType === "保護者" && this.guardianProfession === "その他" ? this.guardianProfessionOther : "",
          exam_date: this.examDate,
          birth_date: this.birthDate === "" ? null : this.birthDate,
          gender: this.gender,
          grade: this.grade,
          diagnosis_status: this.diagnosisStatus,
        },
      });

      this.loading = false;

      if (!result.ok) {
        this.errorMessage = result.message;
        if (result.status === 401) {
          Session.clear();
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        }
        return;
      }

      window.location.href = "intro.html";
    },
  },
}).mount("#app");
</script>
</body>
</html>
